<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>이상현상 처리국 - 관제 터미널</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 1. 상단: 요원 정보 -->
  <div class="box profile-area">
    <div class="profile-img"></div>
    <div class="profile-info">
      <div>NAME: 박성호 | CODE: A-0924</div>
      <div>소속: S-USA / 현장조</div>
      <div>Heart Rate (HR): <span id="hr-val">80</span> bpm</div>
      <div>정신 오염도: <span id="mental-val">0</span>%</div>
      <div class="gauge-bg"><div id="mental-bar" class="gauge-fill"></div></div>
    </div>
  </div>

  <!-- 2. 중간: 바디캠 & 대화/선택지 -->
  <div class="mid-area">
    <!-- 바디캠 -->
    <div class="box bodycam">
      <video autoplay loop muted playsinline style="position: absolute; width: 100%; height: 100%; object-fit: cover; opacity: 0.5;">
        <source src="img/noise.mp4" type="video/mp4">
      </video>
      <div class="cam-text">⚠️ BODYCAM NO SIGNAL<br>[AUDIO ONLY]</div>
    </div>

    <!-- 대화/선택지 -->
    <div class="box comm-area">
      <div id="voice-log" class="voice-log">A-0924 음성신호를 수신 중...</div>
      <div id="choices-panel" class="choices-container"></div>
    </div>
  </div>
    
  <!-- 3. 관제로그 -->
  <div class="box control-log">
    <strong>[관제 상태 기록]</strong>
    <div id="log-text" style="margin-top: 8px;">시스템이 가동되었습니다. 현장 요원의 신호를 감지합니다.</div>
  </div>

  <!-- 4. 이상현상 일람 -->
  <div class="box anomaly-info">
    <strong>[현재 감지된 이상현상 데이터]</strong>
    <div id="anomaly-details" style="margin-top: 8px; line-height: 1.4;">불러오는 중...</div>
  </div>

  <!-- 내장 데이터 및 게임 스크립트 -->
  <script>
    // JSON 데이터를 코드 내부에 직접 정의 (CORS 에러 원천 차단)
    const anomalyData = [
      {
        "name": "거미다리",
        "dangerLevel": "Class 3",
        "symptom": "어둡고 습한 구역에서 관절음이 들리며, 두부 시선 접촉 시 정신 오염도 급증",
        "scenarios": [
          {
            "voiceLog": "천장에 있는 데요?",
            "correctAction": "시선을 바닥으로 고정하고 후퇴 지령 내리기",
            "wrongActions": [
              "손전등을 비추어 정체를 확인하기",
              "이름을 크게 불러 반응 유도하기"
            ],
            "successMessage": "안전하게 시선을 차단하고 구역을 이탈했습니다.",
            "failureMessage": "개체와 시선이 접촉하여 정신 오염도가 급증했습니다!"
          }
        ]
      }
    ];

    let currentScenario = null;

    // 게임 초기화 실행
    function initGame() {
      const data = anomalyData;
      const randomAnomaly = data[Math.floor(Math.random() * data.length)];
      const randomScenario = randomAnomaly.scenarios[Math.floor(Math.random() * randomAnomaly.scenarios.length)];
      
      currentScenario = randomScenario;
      setupGame(randomAnomaly, randomScenario);
    }

    // 화면 데이터 세팅 및 선택지 무작위 배치
    function setupGame(anomaly, scenario) {
      document.getElementById('anomaly-details').innerHTML = `
        <strong>개체명:</strong> ${anomaly.name} (${anomaly.dangerLevel})<br>
        <strong>증상:</strong> ${anomaly.symptom}
      `;

      document.getElementById('voice-log').innerText = `"[박성호] ${scenario.voiceLog}"`;

      let options = [
        { text: scenario.correctAction, isCorrect: true },
        { text: scenario.wrongActions[0], isCorrect: false },
        { text: scenario.wrongActions[1], isCorrect: false }
      ];
      options.sort(() => Math.random() - 0.5);

      const choicesPanel = document.getElementById('choices-panel');
      choicesPanel.innerHTML = '';
      
      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.innerText = `> ${opt.text}`;
        btn.onclick = () => handleChoice(opt.isCorrect);
        choicesPanel.appendChild(btn);
      });
    }

    // 선택지 클릭 처리
    function handleChoice(isCorrect) {
      const logText = document.getElementById('log-text');
      const hrVal = document.getElementById('hr-val');
      const mentalVal = document.getElementById('mental-val');
      const mentalBar = document.getElementById('mental-bar');

      if (isCorrect) {
        logText.innerHTML = `<span style="color:#00ffcc;">[SUCCESS] ${currentScenario.successMessage}</span>`;
        hrVal.innerText = "85";
      } else {
        logText.innerHTML = `<span style="color:#ff3366;">[FAIL] ${currentScenario.failureMessage}</span>`;
        hrVal.innerText = "145";
        mentalVal.innerText = "68";
        if (mentalBar) mentalBar.style.width = "68%";
      }
    }

    // 실행
    initGame();
  </script>
</body>
</html>
